# Clean Ledger quality gate. Fails a pull request that adds complexity,
# duplication or security findings compared with .ledger/baseline.json.
# Uses only free, open-source tools and never calls Claude.
name: ledger-gate

on:
  pull_request:

jobs:
  ledger-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install analysis tools
        run: |
          pip install lizard
          pip install semgrep   # remove this line if the baseline was measured without Semgrep
          npm install -g jscpd

      - name: Measure
        run: bash .ledger/measure.sh

      - name: Compare with baseline
        run: python3 .ledger/ledger.py gate
