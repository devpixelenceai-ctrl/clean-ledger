# Clean Ledger quality gate. Fails a pull request that adds complexity,
# duplication or security findings compared with .ledger/baseline.json.
# Uses only free, open-source tools and never calls Claude.
# Generated by `python3 .ledger/ledger.py render-gate`, which pins the tool
# versions used for the baseline. Consider pinning the actions to commit SHAs.
name: ledger-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  ledger-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install analysis tools
        run: |
          pip install lizard=={{LIZARD_VERSION}}
          pip install semgrep=={{SEMGREP_VERSION}}
          npm install -g jscpd@{{JSCPD_VERSION}}

      - name: Measure
        run: bash .ledger/measure.sh

      - name: Compare with baseline
        run: python3 .ledger/ledger.py gate
