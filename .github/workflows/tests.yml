# Run the Clean Ledger test suite on every push to main and every pull request.
# Read-only token, actions pinned to full commit hashes, no persisted credentials,
# and no pull_request_target (forked code never runs with write access).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON manifests and templates
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json \
                   skills/clean-ledger/assets/settings.json skills/clean-ledger/assets/settings.sandboxed.json; do
            python -m json.tool "$f" > /dev/null
          done

      - name: Shell syntax
        run: |
          bash -n skills/clean-ledger/scripts/measure.sh
          bash -n e2e/run.sh e2e/container/e2e-run e2e/container/e2e-smoke

      - name: Test suite
        run: ./tests/run_tests.sh
